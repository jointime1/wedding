# GitLab Pages deploy for the Astro site.
# Serves the built `dist/` (renamed to `public/`) at the project's
# unique Pages domain: https://wedding-a38614.gitlab.io/  (base is /).
image: node:20

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx astro build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
